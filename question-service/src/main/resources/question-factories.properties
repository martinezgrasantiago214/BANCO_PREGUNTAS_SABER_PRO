# Fabricas de preguntas que el QuestionFactoryRegistry carga por Reflexion
# (idea del microkernel del primer corte). Para agregar un tipo de pregunta
# nuevo basta con crear otra subclase de QuestionFactory y registrarla aqui,
# sin modificar el resto del servicio (OCP).
# clave=nombre.completo.de.la.Clase
factory.1=co.unicauca.saberpro.question.domain.factory.MultipleChoiceQuestionFactory
factory.2=co.unicauca.saberpro.question.domain.factory.CaseQuestionFactory
factory.3=co.unicauca.saberpro.question.domain.factory.MultimediaQuestionFactory
