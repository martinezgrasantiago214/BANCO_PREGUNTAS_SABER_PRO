server:
  port: ${PORT:8082}

spring:
  application:
    name: question-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

saberpro:
  # Base de datos propia del servicio (SQLite).
  data-dir: ${SABERPRO_DATA_DIR:${user.home}/BancoPreguntasSaberPro}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
