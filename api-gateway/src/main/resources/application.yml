server:
  port: ${PORT:8080}

# Direcciones de los microservicios. En Docker se reemplazan por el nombre del
# contenedor (ver docker-compose.yml).
services:
  user: ${USER_SERVICE_URL:http://localhost:8081}
  question: ${QUESTION_SERVICE_URL:http://localhost:8082}
  review: ${REVIEW_SERVICE_URL:http://localhost:8083}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${services.user}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: question-service
          uri: ${services.question}
          predicates:
            - Path=/api/questions/**
        - id: review-service
          uri: ${services.review}
          predicates:
            - Path=/api/reviews/**
        # Documentacion OpenAPI de cada servicio, para el Swagger UI del gateway.
        - id: user-service-docs
          uri: ${services.user}
          predicates:
            - Path=/docs/user-service/v3/api-docs
          filters:
            - RewritePath=/docs/user-service/(?<path>.*), /$\{path}
        - id: question-service-docs
          uri: ${services.question}
          predicates:
            - Path=/docs/question-service/v3/api-docs
          filters:
            - RewritePath=/docs/question-service/(?<path>.*), /$\{path}
        - id: review-service-docs
          uri: ${services.review}
          predicates:
            - Path=/docs/review-service/v3/api-docs
          filters:
            - RewritePath=/docs/review-service/(?<path>.*), /$\{path}

# Swagger UI unificado: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /docs/user-service/v3/api-docs
      - name: question-service
        url: /docs/question-service/v3/api-docs
      - name: review-service
        url: /docs/review-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
