server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ---------------- APIs de negocio
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: question-service
          uri: lb://question-service
          predicates:
            - Path=/api/questions/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        # ---------------- documentos OpenAPI de cada servicio (para el Swagger unificado)
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/docs/user-service/v3/api-docs
          filters:
            - RewritePath=/docs/user-service/(?<path>.*), /$\{path}
        - id: question-service-docs
          uri: lb://question-service
          predicates:
            - Path=/docs/question-service/v3/api-docs
          filters:
            - RewritePath=/docs/question-service/(?<path>.*), /$\{path}
        - id: review-service-docs
          uri: lb://review-service
          predicates:
            - Path=/docs/review-service/v3/api-docs
          filters:
            - RewritePath=/docs/review-service/(?<path>.*), /$\{path}
        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/docs/notification-service/v3/api-docs
          filters:
            - RewritePath=/docs/notification-service/(?<path>.*), /$\{path}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /docs/user-service/v3/api-docs
      - name: question-service
        url: /docs/question-service/v3/api-docs
      - name: review-service
        url: /docs/review-service/v3/api-docs
      - name: notification-service
        url: /docs/notification-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
