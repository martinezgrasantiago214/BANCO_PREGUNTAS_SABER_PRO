server:
  port: ${PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:file:./data/users-db;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    email-domain: ${SEED_EMAIL_DOMAIN:saberpro.test}
    # Demo con Gmail: SEED_EMAIL_BASE=equipo@gmail.com -> equipo+rev1@gmail.com, etc.
    email-base: ${SEED_EMAIL_BASE:}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/users_db
    username: saberpro
    password: saberpro
