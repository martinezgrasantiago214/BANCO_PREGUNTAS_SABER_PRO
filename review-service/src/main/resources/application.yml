server:
  port: ${PORT:8083}

spring:
  application:
    name: review-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

saberpro:
  # Base de datos propia del servicio (SQLite): pendientes, asignaciones y evaluaciones.
  data-dir: ${SABERPRO_DATA_DIR:${user.home}/BancoPreguntasSaberPro}
  # El review-service consulta el rol de cada revisor en el user-service (HU04).
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
