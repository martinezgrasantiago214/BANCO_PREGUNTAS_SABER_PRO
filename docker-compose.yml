# Banco de Preguntas Saber PRO - despliegue completo de la iteracion 2
#   mvn -DskipTests package
#   docker compose up --build -d
# Escenario de escalabilidad (replicas de consumidores):
#   docker compose up -d --scale notification-service=3 --scale review-service=2

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_URL: http://discovery-server:8761/eureka
  RABBIT_HOST: rabbitmq

x-service-deps: &service-deps
  rabbitmq:
    condition: service_healthy
  postgres:
    condition: service_healthy
  discovery-server:
    condition: service_started

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"   # consola: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saberpro
      POSTGRES_PASSWORD: saberpro
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saberpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    ports:
      - "8761:8761"     # panel Eureka: http://localhost:8761

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    ports:
      - "8080:8080"     # unica URL que usa el frontend; Swagger: /swagger-ui.html
    depends_on:
      - discovery-server

  user-service:
    build: { context: ., args: { MODULE: user-service } }
    environment:
      <<: *service-env
      SEED_EMAIL_BASE: ${SEED_EMAIL_BASE:-}
    depends_on: *service-deps

  question-service:
    build: { context: ., args: { MODULE: question-service } }
    environment:
      <<: *service-env
    depends_on: *service-deps

  review-service:
    build: { context: ., args: { MODULE: review-service } }
    environment:
      <<: *service-env
      REVIEW_DECISION_POLICY: UNANIMOUS
    depends_on: *service-deps

  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *service-env
      MAIL_MODE: ${MAIL_MODE:-outbox}
      MAIL_OUTBOX_DIR: /app/outbox
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@saberpro.test}
      MAIL_SIMULATED_LATENCY_MS: ${MAIL_SIMULATED_LATENCY_MS:-0}
      LISTENER_CONCURRENCY: ${LISTENER_CONCURRENCY:-2}
      LISTENER_MAX_CONCURRENCY: ${LISTENER_MAX_CONCURRENCY:-8}
    volumes:
      - ./outbox:/app/outbox   # los correos simulados aparecen en ./outbox
    depends_on: *service-deps

volumes:
  pgdata:
