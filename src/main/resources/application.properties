# Configuracion del microservicio REST (Taller de Microservicios).
# Solo lo lee Spring Boot; la aplicacion Swing no lo usa.
spring.application.name=banco-preguntas-api
server.port=8080

# JSON indentado: mas legible en los pantallazos de Postman
spring.jackson.serialization.indent-output=true

# La API no usa Swing
spring.main.banner-mode=console
